services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d main_db" ]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 5

  main-service:
    build: ./main-service
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis_server:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production-12345}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./main-service:/app
      - media_data:/app/media
    command: [ "sh", "-c", "python manage.py migrate && python manage.py seed_demo_users && python manage.py runserver 0.0.0.0:8000" ]

  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis_server:6379/0}
      MAIN_SERVICE_URL: http://main-service:8000
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
      JOB_CALLBACK_URL: http://main-service:8000/api/internal/worker-callback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./ai-worker:/app
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
      main-service:
        condition: service_started
    command: [ "python", "main.py" ]

  whatsapp-service:
    build: ./whatsapp-service
    env_file:
      - path: ./whatsapp-service/.env
        required: false
    environment:
      PORT: 3000
      AUTH_DIR: /app/auth/whatsapp
      MAIN_SERVICE_INBOUND_URL: http://main-service:8000/api/whatsapp/inbound
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/app/auth
    depends_on:
      - main-service

volumes:
  pgdata:
  media_data:
  whatsapp_auth:
