services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  main-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      REDIS_URL: 
      DJANGO_SECRET_KEY: 
      DEBUG: 
      ALLOWED_HOSTS: 
      CORS_ALLOWED_ORIGINS: 
      CSRF_TRUSTED_ORIGINS: 
      CORS_ALLOW_ALL_ORIGINS: 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    command: [ "sh", "-c", "python manage.py migrate && python manage.py seed_demo_users && python manage.py runserver 0.0.0.0:8000" ]
  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: 
      MAIN_SERVICE_URL: http://main-service:8000
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
      JOB_CALLBACK_URL: http://main-service:8000/api/internal/worker-callback
      GEMINI_API_KEY: 
      GEMINI_MODEL: 
      OPENAI_API_KEY: 
      ANTHROPIC_API_KEY: 
    depends_on:
      redis:
        condition: service_healthy
      main-service:
        condition: service_started
    command: ["python", "main.py"]

  whatsapp-service:
    build: ./whatsapp-service
    restart: always
    env_file:
      - path: ./whatsapp-service/.env
        required: false
    environment:
      PORT: 3000
      AUTH_DIR: /app/auth/whatsapp
      MAIN_SERVICE_INBOUND_URL: http://main-service:8000/api/whatsapp/inbound
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/app/auth
    depends_on:
      - main-service

volumes:
  pgdata:
  media_data:
  whatsapp_auth:
